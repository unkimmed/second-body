name: Deploy API

# GitHub → Actions → "Deploy API" → Run workflow 버튼으로 Render(API) 배포 트리거.
# 웹(Vercel)은 main push 시 자동 배포되므로 여기 없음.
on:
  workflow_dispatch:

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy API (Render)
        run: curl -fsSL -X POST "${{ secrets.RENDER_DEPLOY_HOOK_API }}"
